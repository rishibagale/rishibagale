<svg viewBox="0 0 920 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated skill chain">

<defs>
  <linearGradient id="nodeGrad2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="100%" stop-color="#a78bfa"/>
  </linearGradient>
  <filter id="glow2" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<polyline id="chain" points="70.0,48 226.0,48 382.0,48 538.0,48 694.0,48 850.0,48" fill="none" stroke="#2d3348" stroke-width="1.5"/>
<circle r="3.2" fill="#f472b6" filter="url(#glow2)"><animateMotion dur="4.5s" repeatCount="indefinite" begin="-0s"><mpath href="#chain"/></animateMotion></circle>
<circle r="3.2" fill="#f472b6" filter="url(#glow2)"><animateMotion dur="4.5s" repeatCount="indefinite" begin="-2.25s"><mpath href="#chain"/></animateMotion></circle>
